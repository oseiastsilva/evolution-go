# Fork Fintalk do Evolution Go — ambiente local de teste/desenvolvimento.
#
# Baseado no exemplo oficial (docker/examples/docker-compose.yml), com duas
# diferenças: (1) a imagem é BUILDADA deste código-fonte (com os patches em
# patches/), não baixada do Docker Hub; (2) o Postgres já nasce com os dois
# bancos, limite de conexões maior e reciclagem de conexões idle.
#
# Uso:
#   cp fintalk.env.example .env   # ajuste as senhas/chaves (opcional p/ teste local)
#   docker compose up -d --build
#   docker compose logs -f evogo
#
# ATENÇÃO: `docker compose down` preserva os dados; `down -v` APAGA o volume
# do Postgres (sessões do WhatsApp) e exige parear tudo de novo.

services:
  evogo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: 0.7.2-fintalk.1
    image: evolution-go-fintalk:0.7.2.1
    container_name: evogo-fork
    restart: unless-stopped
    ports:
      - "${EVOGO_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: "evolution"

      # Chave global da API (troque em produção — ver fintalk.env.example)
      GLOBAL_API_KEY: "${GLOBAL_API_KEY:-dev-global-api-key-troque}"

      # Bancos do Evo Go (host "postgres" = serviço ao lado neste compose)
      POSTGRES_AUTH_DB: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"

      WADEBUG: "${WADEBUG:-INFO}"
      LOGTYPE: "console"

      # Não subir instâncias sem pareamento no boot (evita o loop de QR que
      # amplificava o vazamento de conexões — ver PATCHES.md).
      CONNECT_ON_STARTUP: "${CONNECT_ON_STARTUP:-false}"
      WEBHOOK_FILES: "true"

      AMQP_GLOBAL_ENABLED: "false"
      NATS_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "5"
    volumes:
      - evogo_data:/app/dbdata
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - evogo_net

  postgres:
    image: postgres:16-alpine
    container_name: evogo-fork-postgres
    restart: unless-stopped
    # max_connections maior que o padrão (100) como margem; a correção de
    # verdade é o patch do pool (patches/001). idle_session_timeout é rede de
    # segurança: recicla qualquer conexão idle esquecida (inclusive órfãs de
    # versões sem o patch).
    command: >-
      postgres
      -c max_connections=300
      -c idle_session_timeout=300000
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - evogo_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - evogo_net

volumes:
  evogo_data:
  evogo_pgdata:

networks:
  evogo_net:
    driver: bridge
